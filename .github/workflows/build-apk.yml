name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          fi

      - name: Install Dependencies
        run: npm install

      - name: Generate App Icon and Splash
        run: |
          # سيقوم بتوليد الأيقونات تلقائياً إذا كانت الصورة icon.png أو photo_2026-11-01_00-09-13.jpg موجودة
          if [ -f "icon.png" ]; then
            npx @capacitor/assets generate --icon icon.png --android
          elif [ -f "photo_2026-11-01_00-09-13.jpg" ]; then
            npx @capacitor/assets generate --icon photo_2026-11-01_00-09-13.jpg --android
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk