name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          # نسخ ملف اللعبة إلى المجلد الذي يتوقعه Capacitor
          cp index.html www/

      - name: Install Dependencies
        run: npm install

      - name: Generate App Icon
        run: |
          # توليد الأيقونة بناءً على الصورة المتاحة
          if [ -f "icon.png" ]; then
            npx @capacitor/assets@latest generate --icon icon.png --android
          elif [ -f "photo_2026-11-01_00-09-13.jpg" ]; then
            npx @capacitor/assets@latest generate --icon photo_2026-11-01_00-09-13.jpg --android
          else
            echo "Skipping icon generation: No icon file found."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android Platform
        run: |
          # إضافة ومزامنة منصة أندرويد
          npx cap add android || echo "Android platform already exists"
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk