name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Prepare Web Directory & Assets
        run: |
          # تجهيز مجلد الويب
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          fi

          # إعداد مجلد assets للأيقونة
          mkdir -p assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
          elif [ -f "icon.jpg" ]; then
            cp icon.jpg assets/icon.png
          elif [ -f "photo_2026-11-01_00-09-13.jpg" ]; then
            cp photo_2026-11-01_00-09-13.jpg assets/icon.png
          fi

      - name: Install Dependencies
        run: npm install

      - name: Generate App Icon
        run: |
          npm install @capacitor/assets --save-dev
          
          # منح صلاحيات التنفيذ للأدوات
          chmod -R 755 ./node_modules/.bin/
          
          # البحث عن أي ملف يبدأ بـ icon وتوليد الأيقونة
          ICON_FILE=$(ls assets/icon.* | head -n 1)
          
          if [ -n "$ICON_FILE" ]; then
            echo "تم العثور على الأيقونة: $ICON_FILE"
            ./node_modules/.bin/capacitor-assets generate --icon "$ICON_FILE" --android --force
          else
            echo "خطأ: لم يتم العثور على ملف أيقونة في مجلد assets!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android Platform
        run: |
          npx cap add android || echo "Android platform already exists"
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk