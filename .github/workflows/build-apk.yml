name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Prepare Web Directory & Assets
        run: |
          mkdir -p www
          # نقل ملف اللعبة إلى مجلد الويب
          if [ -f "index.html" ]; then
            cp index.html www/
            echo "تم نسخ index.html إلى www"
          fi

          # إعداد مجلد assets للأيقونة كما يتوقعه capacitor-assets
          mkdir -p assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
          elif [ -f "photo_2026-11-01_00-09-13.jpg" ]; then
            cp photo_2026-11-01_00-09-13.jpg assets/icon.png
          fi

      - name: Install Dependencies
        run: npm install

      - name: Generate App Icon
        run: |
          # توليد الأيقونات مع استخدام --force لإجبار الاستبدال
          npx @capacitor/assets@latest generate --android --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android Platform
        run: |
          npx cap add android || echo "Android platform already exists"
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk